<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04361A">
<title>TerraNexis — Smarter Farming Starts Here</title>
<meta name="description" content="Real-time soil insights that help you know exactly when to water. Free 60-day farm trial for Ontario growers.">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: #04361A;
    overflow: hidden;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    min-height: 100svh;
    font-family: -apple-system, system-ui, sans-serif;
  }
  .flyer-frame {
    position: relative;
    width: min(100vw, calc(100vh * 2 / 3));
    height: min(100vh, calc(100vw * 3 / 2));
    width: min(100vw, calc(100svh * 2 / 3));
    height: min(100svh, calc(100vw * 3 / 2));
  }
  .flyer-frame img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .qr-link {
    position: absolute;
    left: 5%;
    top: 45.5%;
    width: 24%;
    height: 16%;
    display: block;
    cursor: pointer;
    background: #FFFFFF;
    padding: 0.4%;
    border-radius: 4px;
    transition: transform 0.15s ease;
  }
  .qr-link img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
  }
  .qr-link:hover,
  .qr-link:focus-visible {
    transform: scale(1.03);
    outline: 2px solid rgba(180, 212, 76, 0.6);
    outline-offset: 2px;
  }
  .page-nav {
    position: fixed;
    right: max(18px, env(safe-area-inset-right));
    top: 50%;
    z-index: 10;
    display: grid;
    gap: 8px;
    transform: translateY(-50%);
    font: 700 13px/1 -apple-system, system-ui, sans-serif;
  }
  .page-nav a {
    min-width: 84px;
    border: 1px solid rgba(180, 212, 76, 0.45);
    border-radius: 999px;
    padding: 10px 14px;
    color: #FFFFFF;
    background: rgba(4, 54, 26, 0.86);
    text-align: center;
    text-decoration: none;
    box-shadow: 0 10px 24px rgba(0, 0, 0, 0.2);
    backdrop-filter: blur(10px);
  }
  .page-nav a[aria-current="page"] {
    color: #04361A;
    background: #B4D44C;
  }
  .page-nav a:focus-visible {
    outline: 2px solid #FFFFFF;
    outline-offset: 2px;
  }
  @media (max-width: 820px) {
    .page-nav {
      right: 50%;
      top: auto;
      bottom: max(14px, env(safe-area-inset-bottom));
      grid-auto-flow: column;
      transform: translateX(50%);
    }
    .page-nav a {
      min-width: 72px;
      padding: 10px 12px;
    }
  }
</style>
</head>
<body>
  <div class="flyer-frame">
    <img src="assets/flyer-page-1.png" alt="TerraNexis — Smarter Farming Starts Here">
    <a class="qr-link" href="/trial" aria-label="Scan to start your free farm trial">
      <img src="assets/qr-trial.png" alt="">
    </a>
  </div>
  <nav class="page-nav" aria-label="Flyer pages">
    <a href="/" aria-current="page">Home</a>
    <a href="/page-2.html">Page 2</a>
    <a href="/page-3.html">Alerts</a>
  </nav>
</body>
</html>
