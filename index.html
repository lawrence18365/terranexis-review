<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04361A">
<title>TerraNexis — Smarter Farming Starts Here</title>
<meta name="description" content="Real-time soil insights that help you know exactly when to water. Free 60-day farm trial for Ontario growers.">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: #04361A;
    overflow: hidden;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    min-height: 100svh;
    font-family: -apple-system, system-ui, sans-serif;
  }
  .flyer-frame {
    position: relative;
    width: min(100vw, calc(100vh * 2 / 3));
    height: min(100vh, calc(100vw * 3 / 2));
    width: min(100vw, calc(100svh * 2 / 3));
    height: min(100svh, calc(100vw * 3 / 2));
  }
  .flyer-frame img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .qr-link {
    position: absolute;
    left: 5%;
    top: 45.5%;
    width: 24%;
    height: 16%;
    cursor: pointer;
    background: transparent;
    border-radius: 8px;
    transition: background-color 0.15s ease;
  }
  .qr-link:hover,
  .qr-link:focus-visible {
    background: rgba(180, 212, 76, 0.18);
    outline: 2px solid rgba(180, 212, 76, 0.6);
    outline-offset: 2px;
  }
</style>
</head>
<body>
  <div class="flyer-frame">
    <img src="assets/flyer-page-1.png" alt="TerraNexis — Smarter Farming Starts Here">
    <a class="qr-link" href="page-2.html" aria-label="Scan to start your free farm trial"></a>
  </div>
</body>
</html>
